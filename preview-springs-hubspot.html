<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayara Springs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* NAYARA SPRINGS v3 — 2026-08-02 */
/* Hide ALL HubSpot template content */
body > * { display: none !important; visibility: hidden !important; }
body > script { display: none !important; }
body > #nayara-springs-page { display: block !important; visibility: visible !important; }
body { margin: 0 !important; padding: 0 !important; background: #f7f5f0 !important; }
body::before, body::after { display: none !important; }
/* HubSpot element reset — neutralize CMS base styles */
#nayara-springs-page h1, #nayara-springs-page h2, #nayara-springs-page h3, #nayara-springs-page h4 { padding: 0; border: none; font-family: 'Playfair Display', Georgia, serif !important; }
#nayara-springs-page p, #nayara-springs-page span, #nayara-springs-page div, #nayara-springs-page a, #nayara-springs-page blockquote, #nayara-springs-page cite, #nayara-springs-page li { font-family: 'DM Sans', -apple-system, sans-serif !important; }
#nayara-springs-page p { margin: 0 0 20px 0; padding: 0; }
#nayara-springs-page img { border: none; outline: none; }
#nayara-springs-page a { color: inherit; text-decoration: none; }
#nayara-springs-page blockquote { margin: 0; padding: 0; border: none; background: none; }
#nayara-springs-page ul, #nayara-springs-page ol { list-style: none; margin: 0; padding: 0; }
/* Double-specificity override for HubSpot theme p rule */
body #nayara-springs-page p { font-family: 'DM Sans', -apple-system, sans-serif !important; }
body #nayara-springs-page .split__text h2 { margin-bottom: 20px !important; }
/* Override HubSpot Elevate theme link variables */
#nayara-springs-page {
  --hsElevate--link--primary__fontColor: #fff;
  --hsElevate--link--primary__fontColor--hover: #fff;
  --hsElevate--link--primary__textDecoration: none;
  --hsElevate--link--primary__textDecoration--hover: none;
}
/* Reset non-button links only */
#nayara-springs-page a:not(.cta-btn):not(.top-cta):not(.cta-pulse) { color: inherit !important; text-decoration: none !important; }
/* Button color overrides — bulletproof pattern */
#nayara-springs-page .cta-btn { color: #fff !important; text-decoration: none !important; }
#nayara-springs-page .cta-btn:hover { color: #fff !important; text-decoration: none !important; }
#nayara-springs-page .cta-btn--outline { color: #4a7c59 !important; border: 1px solid #4a7c59 !important; background: transparent !important; }
#nayara-springs-page .cta-btn--outline:hover { background: var(--canopy-light) !important; color: #fff !important; }
#nayara-springs-page .top-cta { color: #fff !important; text-decoration: none !important; }
#nayara-springs-page .hero .cta-pulse { color: #fff !important; text-decoration: none !important; }
#nayara-springs-page .final-cta a { color: #fff !important; text-decoration: none !important; }
#nayara-springs-page .section--dark { color: #fff !important; }
#nayara-springs-page .section--dark h2 { color: #fff !important; }
#nayara-springs-page .section--dark p { color: rgba(255,255,255,0.85) !important; }

:root {
  --canopy: #1a3a2a;
  --canopy-light: #2a5a3a;
  --gold: #c9a96e;
  --linen: #f7f5f0;
  --bark: #3a2a1a;
  --cloud: #edeee2;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); overflow-x: hidden; color: var(--bark); }
img { max-width: 100%; height: auto; }


/* CTA BUTTONS */
.cta-btn { display: inline-block; min-width: 240px; padding: 18px 36px; font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; text-align: center; color: #fff !important; background: var(--canopy-light); text-decoration: none !important; position: relative; overflow: hidden; }
.cta-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); animation: shimmerSweep 3.5s ease-in-out infinite; }
.cta-btn--outline { background: transparent !important; border: 1px solid var(--canopy-light); color: var(--canopy-light) !important; }
.cta-btn--outline:hover { background: var(--canopy-light) !important; color: #fff !important; }
.cta-btn--full { width: 100%; display: block; }

/* AWARD BADGE (above CTA) */
.award-badge { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); text-align: center; margin-bottom: 14px; }

/* SECTION LAYOUT */
.section { padding: 100px 80px; }
.section--cream { background: var(--linen); }
.section--white { background: #fff; }
.section--cloud { background: var(--cloud); }
.section--dark { background: var(--canopy); color: #fff; }
.section--bark { background: #e0efe0; color: #1a1209; }
.section--mint { background: #f0f7f1; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1400px; margin: 0 auto; }
.split--text-left { grid-template-columns: 1fr 1fr; }
.split--text-right { grid-template-columns: 1fr 1fr; }
.split__text h2 { font-family: var(--font-display); font-size: clamp(2rem, 3vw, 2.8rem); font-weight: 400; line-height: 1.2; margin-bottom: 20px; }
.split__text p { font-size: 16px; line-height: 1.8; opacity: 0.85; margin-bottom: 20px; }
.split__ctas { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }

/* HERO */
.hero { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 600px; overflow: hidden; }
.hero video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.hero__overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.55) 100%); }
.hero__top-bar { position: absolute; top: 40px; left: 80px; right: 40px; z-index: 10; display: flex; align-items: center; justify-content: flex-start; }
.hero__logo { width: 224px; height: auto; opacity: 0; animation: fadeIn 1.2s ease forwards 0.2s; }
.hero__top-right { position: absolute; right: 0; display: flex; align-items: center; gap: 16px; opacity: 0; animation: fadeIn 1.2s ease forwards 0.2s; }
.top-cta { display: inline-block; padding: 22px 120px; font-family: var(--font-body); font-size: 15px; text-align: center; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #fff !important; background: var(--canopy-light); text-decoration: none !important; position: relative; overflow: hidden; animation: scalePulse 2.5s ease-in-out infinite 1.8s; }
.top-cta::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); animation: shimmerSweep 3.5s ease-in-out infinite 2s; }
.hero__content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 0 80px 10vh 80px; }
.hero__awards { display: flex; align-items: flex-end; gap: 28px; margin-bottom: 40px; margin-top: auto; opacity: 0; animation: fadeUp 1.2s ease forwards 0.8s; }
.hero__award-block { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; }
.hero__award-stat { font-family: var(--font-display); font-size: 56px; font-weight: 400; color: #fff; line-height: 1; background: linear-gradient(90deg, #fff 0%, #fff 40%, var(--gold) 50%, #fff 60%, #fff 100%); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: goldStreak 4s ease-in-out infinite; }
.hero__award-label { font-family: var(--font-body); font-size: 10px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.9); line-height: 1; margin-top: 10px; white-space: nowrap; }
.hero__award-divider { width: 1px; height: 60px; background: rgba(255,255,255,0.3); }
.hero__keys-badge { width: auto; height: 120px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); animation: keysGlow 3s ease-in-out infinite; margin-bottom: 0; transform: translateY(30px); }
@keyframes keysGlow { 0%, 100% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); } 50% { filter: drop-shadow(0 0 18px rgba(255,255,255,0.8)) drop-shadow(0 0 36px rgba(255,255,255,0.3)); } }
.hero__h1 { font-family: var(--font-display); font-size: clamp(2rem, 3.2vw, 2.8rem); font-weight: 400; color: #fff; line-height: 1.15; letter-spacing: -0.01em; margin-top: -30px; margin-bottom: 30px; max-width: 750px; white-space: nowrap; opacity: 0; animation: fadeUp 1.2s ease forwards 1.4s; }
.hero__subtitle { font-family: var(--font-body); font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.85); letter-spacing: 0.15em; text-transform: uppercase; margin-top: -20px; margin-bottom: 30px; opacity: 0; animation: fadeUp 1.2s ease forwards 1.6s; }
.hero .cta-pulse { display: inline-block; padding: 22px 140px; font-family: var(--font-body); font-size: 15px; text-align: center; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #fff !important; background: var(--canopy-light); text-decoration: none !important; position: relative; overflow: hidden; opacity: 0; animation: fadeUp 1.2s ease forwards 2.0s, scalePulse 2.5s ease-in-out infinite 3s; }
.hero .cta-pulse::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); animation: shimmerSweep 3.5s ease-in-out infinite 2s; }

/* WILDLIFE GRID */
.wildlife-grid { max-width: 1400px; margin: 0 auto; }
.wildlife-grid h2 { font-family: var(--font-display); font-size: clamp(2rem, 3vw, 2.8rem); font-weight: 400; text-align: center; margin-bottom: 50px; color: #1a1209; }
.wildlife-row { display: grid; gap: 20px; margin-bottom: 20px; }
.wildlife-row--top { grid-template-columns: repeat(4, 1fr); }
.wildlife-row--bottom { grid-template-columns: repeat(4, 1fr); }
.wildlife-card { position: relative; overflow: hidden; aspect-ratio: 3/4; }
.wildlife-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
.wildlife-card:hover img { transform: scale(1.05); }
.wildlife-card__label { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 14px; background: linear-gradient(to top, rgba(0,0,0,0.75) 60%, transparent); color: #fff; }
.wildlife-card__label h4 { margin: 0 0 2px; font-family: var(--font-display); font-size: 14px; font-weight: 500; color: #fff; }
.wildlife-card__label p { margin: 0; font-size: 10.5px; line-height: 1.4; color: rgba(255,255,255,0.82); }
.wildlife-card__label .scientific { font-style: italic; font-size: 9.5px; color: rgba(255,255,255,0.6); margin-top: 2px; display: block; }

/* GASTRONOMY */
.gastro-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.gastro-grid h2 { grid-column: 1 / -1; font-family: var(--font-display); font-size: clamp(2rem, 3vw, 2.8rem); font-weight: 400; text-align: center; margin-bottom: 20px; }
.gastro-card { position: relative; overflow: hidden; aspect-ratio: 3/4; }
.gastro-card img { width: 100%; height: 100%; object-fit: cover; }
.gastro-card__label { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); color: #fff; }
.gastro-card__label h3 { font-family: var(--font-display); font-size: 22px; font-weight: 400; margin-bottom: 4px; color: #fff; }
.gastro-card__label span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; color: #fff; }


/* FINAL CTA */
.final-cta { text-align: center; padding: 0 40px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 15%; aspect-ratio: 3338 / 1551; background: url('https://files.manuscdn.com/user_upload_by_module/session_file/310519663090891297/EZCnAHqakpVqolPC.jpg'); background-size: cover; background-position: top center; }
.final-cta::before { content: ''; position: absolute; inset: 0; background: rgba(26, 18, 9, 0.4); }
.final-cta h2 { font-family: var(--font-display); font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 400; color: #fff; margin-bottom: 40px; position: relative; z-index: 1; }
.final-cta .cta-btn { padding: 22px 140px; font-size: 15px; letter-spacing: 0.22em; position: relative; z-index: 1; background: #2a5a3a; border: none; color: #fff !important; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shimmerSweep { 0% { left: -100%; } 40% { left: 100%; } 100% { left: 100%; } }
@keyframes scalePulse { 0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(0,0,0,0.15); } 50% { transform: scale(1.03); box-shadow: 0 8px 36px rgba(42,90,58,0.5); } }
@keyframes goldStreak { 0%, 100% { background-position: 100% 0; } 50% { background-position: -100% 0; } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

/* FADE IN ON SCROLL */
.fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }

/* MOBILE */
@media (max-width: 768px) {
  .section { padding: 60px 20px; }
  .split { grid-template-columns: 1fr; gap: 24px; }
  .split__text { text-align: center; }
  .split__text h2 { font-size: 1.6rem; }
  .split__ctas { flex-direction: column; gap: 12px; align-items: stretch; }
  .cta-btn { min-width: unset; width: 100%; padding: 16px 24px; font-size: 11px; }
  .hero__video-desktop { display: none; }
  .hero__video-mobile { display: block !important; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero__content { padding: 0 20px 8vh 20px; }
  .hero__top-bar { display: none; }
  .hero__mobile-logo { display: block; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10; width: 200px; height: auto; opacity: 0; animation: fadeIn 1.2s ease forwards 0.2s; }
  .hero__awards { gap: 14px; margin-bottom: 20px; }
  .hero__award-stat { font-size: 36px; }
  .hero__award-label { font-size: 8px; }
  .hero__award-divider { height: 36px; }
  .hero__keys-badge { height: 80px; transform: translateY(20px); }
  .hero__h1 { font-size: 1.8rem; margin-top: -10px; margin-bottom: 12px; white-space: normal; }
  .hero__subtitle { font-size: 12px; margin-top: -4px; margin-bottom: 20px; }
  .hero .cta-pulse { padding: 18px 48px; font-size: 11px; width: 100%; }
  .wildlife-row--top { grid-template-columns: 1fr 1fr; }
  .wildlife-row--bottom { grid-template-columns: 1fr 1fr; }
  .wildlife-grid h2 { font-size: 1.6rem; margin-bottom: 24px; }
  .gastro-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gastro-grid h2 { font-size: 1.6rem; }
  .final-cta { padding: 40px 24px; padding-bottom: 25%; }
  .final-cta h2 { font-size: 1.6rem; margin-bottom: 20px; }
  .final-cta .cta-btn { padding: 18px 48px; font-size: 11px; width: 100%; }
  .blog-grid { grid-template-columns: 1fr !important; }
  .final-cta div[style*="display:flex"] a { width: 100% !important; min-width: unset !important; }
}
.hero__video-mobile { display: none; }
.hero__mobile-logo { display: none; }


/* ── At A Glance Strip ── */
.nayara-glance {
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 24px;
  text-align: center;
}
.nayara-glance__title {
  text-align: center;
  font-family: var(--font-display);
  font-size: 0.75rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--canopy);
  opacity: 0.6;
  margin-bottom: 24px;
}
.nayara-glance__grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: stretch;
}
.nayara-glance__item {
  text-align: center;
  padding: 16px 12px;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.nayara-glance__item .glance-label {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--canopy);
  opacity: 0.5;
  margin-bottom: 6px;
}
.nayara-glance__item .glance-value {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 400;
  color: var(--bark);
  line-height: 1.4;
}
.nayara-glance__sep {
  width: 1px;
  background: linear-gradient(to bottom, transparent 10%, var(--canopy) 50%, transparent 90%);
  opacity: 0.25;
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Triggered state */
.nayara-glance.visible .nayara-glance__sep {
  transform: scaleY(1);
}
.nayara-glance.visible .nayara-glance__item:nth-child(1) {
  opacity: 1; transform: translateY(0); transition-delay: 0.3s;
}
.nayara-glance.visible .nayara-glance__item:nth-child(3) {
  opacity: 1; transform: translateY(0); transition-delay: 0.5s;
}
.nayara-glance.visible .nayara-glance__item:nth-child(5) {
  opacity: 1; transform: translateY(0); transition-delay: 0.7s;
}

/* Mobile: stack vertically */
@media (max-width: 480px) {
  .nayara-glance__grid {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .nayara-glance__sep {
    width: 60px;
    height: 1px;
    margin: 0 auto;
    background: linear-gradient(to right, transparent 10%, var(--canopy) 50%, transparent 90%);
    transform: scaleX(0);
    transform-origin: center;
  }
  .nayara-glance.visible .nayara-glance__sep {
    transform: scaleX(1);
  }
}

/* ── Image Carousel (Morph Dissolve) ── */
.nayara-carousel {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  overflow: hidden;
}
.nayara-carousel img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  filter: blur(0px);
  transform: scale(1.02);
  transition: opacity 0.6s ease, filter 0.6s ease, transform 1.8s ease;
}
.nayara-carousel img.active {
  opacity: 1;
  filter: blur(0px);
  transform: scale(1);
  z-index: 2;
  transition: opacity 0.6s ease 0.2s, filter 0.6s ease 0.3s, transform 1.8s ease;
}
.nayara-carousel img.leaving {
  opacity: 0.4;
  filter: blur(6px);
  transform: scale(1);
  z-index: 1;
  transition: opacity 0.5s ease, filter 0.4s ease;
}
.nayara-carousel img.prev {
  opacity: 0;
  filter: blur(0px);
  z-index: 0;
}

/* Carousel dots */
.nayara-carousel-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.nayara-carousel-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--canopy);
  opacity: 0.2;
  transition: opacity 0.3s ease, transform 0.3s ease;
  cursor: pointer;
}
.nayara-carousel-dots span.active {
  opacity: 0.7;
  transform: scale(1.4);
}

/* ── Affiliations Strip ── */
.nayara-affiliations {
  background: #f0f7f1;
  padding: 32px 24px;
  max-width: 100%;
}
.nayara-affiliations__grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: center;
  justify-items: center;
  max-width: 900px;
  margin: 0 auto;
  column-gap: 20px;
}
.nayara-affiliations__item {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 40px;
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.nayara-affiliations__item img {
  height: 200px;
  width: auto;
  max-width: 280px;
  object-fit: contain;
  filter: grayscale(20%);
}
.nayara-affiliations__sep {
  width: 1px;
  height: 140px;
  background: linear-gradient(to bottom, transparent 10%, var(--canopy) 50%, transparent 90%);
  opacity: 0.2;
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Triggered state */
.nayara-affiliations.visible .nayara-affiliations__sep {
  transform: scaleY(1);
}
.nayara-affiliations.visible .nayara-affiliations__item:nth-child(1) {
  opacity: 1; transform: translateY(0); transition-delay: 0.3s;
}
.nayara-affiliations.visible .nayara-affiliations__item:nth-child(3) {
  opacity: 1; transform: translateY(0); transition-delay: 0.5s;
}
.nayara-affiliations.visible .nayara-affiliations__item:nth-child(5) {
  opacity: 1; transform: translateY(0); transition-delay: 0.7s;
}

/* Mobile */
@media (max-width: 480px) {
  .nayara-affiliations { padding: 24px 16px; }
  .nayara-affiliations__grid {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .nayara-affiliations__sep {
    width: 40px;
    height: 1px;
    margin: 0 auto;
    background: linear-gradient(to right, transparent 10%, var(--canopy) 50%, transparent 90%);
    transform: scaleX(0);

/* ── Carousel Engine (Morph Dissolve, 2.5s) ── */
(function() {
  var HOLD = 2500;

  function initCarousel(carouselEl) {
    var imgs = carouselEl.querySelectorAll('img');
    var dotsContainer = carouselEl.nextElementSibling;
    var dots = dotsContainer ? dotsContainer.querySelectorAll('span') : [];
    var current = 0;
    var total = imgs.length;
    if (total < 2) return;

    function advance() {
      var prev = current;
      current = (current + 1) % total;

      // Outgoing: blur and fade
      imgs[prev].classList.remove('active');
      imgs[prev].classList.add('leaving');

      // Incoming: sharpen and appear
      imgs[current].classList.add('active');

      // Clean up leaving state
      setTimeout(function() {
        imgs[prev].classList.remove('leaving');
        imgs[prev].classList.add('prev');
        setTimeout(function() { imgs[prev].classList.remove('prev'); }, 600);
      }, 500);

      // Update dots
      if (dots.length) {
        dots[prev].classList.remove('active');
        dots[current].classList.add('active');
      }
    }

    // Dot click navigation
    dots.forEach(function(dot, i) {
      dot.addEventListener('click', function() {
        if (i === current) return;
        var prev = current;
        current = i;
        imgs[prev].classList.remove('active');
        imgs[prev].classList.add('leaving');
        imgs[current].classList.add('active');
        setTimeout(function() {
          imgs[prev].classList.remove('leaving');
          imgs[prev].classList.add('prev');
          setTimeout(function() { imgs[prev].classList.remove('prev'); }, 600);
        }, 500);
        if (dots.length) {
          dots[prev].classList.remove('active');
          dots[current].classList.add('active');
        }
      });
    });

    setInterval(advance, HOLD);
  }

  // Initialize all carousels on page
  document.querySelectorAll('.nayara-carousel').forEach(initCarousel);
})();

})();
