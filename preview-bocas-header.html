<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayara Bocas header preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap');
body{font-family:'Inter',system-ui,sans-serif}
.heading-serif{font-family:'Playfair Display',Georgia,serif}

/* ---- LOGO placeholder wordmark (swap for your hosted image when you send the link) ----
   Kept dark so it reads on the light header, matching the picture you pasted. */
.logo-wordmark{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;text-decoration:none}
.logo-wordmark .line1{font-weight:700;letter-spacing:.14em;color:#3f3f3f;font-size:clamp(22px,2.5vw,36px);white-space:nowrap}
.logo-wordmark .line2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;color:#3f3f3f;font-size:clamp(13px,1.1vw,17px);letter-spacing:.02em;align-self:center;margin-top:6px}

.nav-link{position:relative;font-weight:700;font-size:.98rem;letter-spacing:.01em}
.nav-link::after{content:"";position:absolute;left:0;bottom:-8px;width:0;height:2px;background:#0D9488;transition:width .25s ease}
.nav-link:hover::after{width:100%}

/* Hero backdrop only so the bar can be judged in place */
.stage{min-height:100vh;background:linear-gradient(rgba(10,37,64,.15),rgba(10,37,64,.15)),url('https://i.postimg.cc/26S6Cb37/Villas-and-Reef.jpg');background-size:cover;background-position:center}
</style>
</head>
<body class="bg-[#F8F5F0] text-[#0A2540]">

  <!-- ===== Header (original layout kept; logo swapped + bigger, Book Now + hamburger added, Contact removed) ===== -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-white/95 border-b border-[#E5E0D5]" style="backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)">
    <div class="max-w-screen-2xl mx-auto px-7 md:px-12">
      <div class="flex items-center justify-between h-28">

        <!-- Logo top-left (bigger) -> nayarabocasdeltoro.com -->
        <a href="https://nayarabocasdeltoro.com/" aria-label="Nayara Bocas del Toro">
          <img src="https://23160175.fs1.hubspotusercontent-na1.net/hubfs/23160175/Nayara%20Bocas%20Del%20Toro%20Wordmark%20Black.jpg"
               alt="Nayara Bocas del Toro" style="height:64px;width:auto;display:block">
        </a>

        <!-- Middle buttons (kept) -->
        <div class="hidden lg:flex items-center gap-x-10 text-[#0A2540]">
          <a href="#the-story" class="nav-link hover:text-[#0D9488] transition-colors">The Story</a>
          <a href="#partners" class="nav-link hover:text-[#0D9488] transition-colors">Partners</a>
          <a href="#approach" class="nav-link hover:text-[#0D9488] transition-colors">Approach</a>
          <a href="#phases" class="nav-link hover:text-[#0D9488] transition-colors">Progress</a>
          <a href="#impact" class="nav-link hover:text-[#0D9488] transition-colors">Impact</a>
          <a href="#participate" class="nav-link hover:text-[#0D9488] transition-colors">Join Us</a>
        </div>

        <!-- Right: Book Now + Adopt a Coral + hamburger accordion (Contact removed) -->
        <div class="flex items-center gap-x-3">
          <a href="https://nayarabocasdeltoro.com/#/booking/step-1?data=('h7hd!'nayara-bocas-del-toro'~a6dt*fs.~r7at!2~cn!0~cg.~al4po*co*gp*rn5ry*rk*re.~rr*ss5ax!0~cy*ds!('p6ls*as*st*h6ee1)~my4s6c6ne1)*1~.3%5D1!null3!%5B4!false~5.)%5D~6e*7s3('%01765431.*_"
             class="hidden sm:inline-flex items-center px-7 py-3 text-base font-semibold rounded-full border-2 border-[#0A2540] text-[#0A2540] hover:bg-[#0A2540] hover:text-white transition">
            Book Now
          </a>
          <a href="#participate"
             class="hidden sm:inline-flex items-center px-7 py-3 text-base font-semibold rounded-full bg-[#0D9488] text-white hover:bg-[#0F766E] transition shadow-md">
            Adopt a Coral
          </a>
          <a href="https://nayarabocasdeltoro.com/#/" class="inline-flex items-center justify-center p-2 -mr-1 text-[#0A2540] hover:text-[#0D9488] transition" aria-label="Menu">
            <i class="fa-solid fa-bars text-2xl"></i>
          </a>
        </div>

      </div>
    </div>
  </nav>

  <div class="stage"></div>

</body>
</html>
