<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayara Bocas header preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif}

/* Hero backdrop just so the transparent header can be judged over a photo */
.stage{position:relative;height:100vh;min-height:640px;
  background:linear-gradient(rgba(10,37,64,.28),rgba(10,37,64,.28)),url('https://i.postimg.cc/26S6Cb37/Villas-and-Reef.jpg');
  background-size:cover;background-position:center}
/* dark gradient at the very top, like the live site, so the white logo always reads */
.stage:before{content:"";position:absolute;top:0;left:0;width:100%;height:160px;z-index:1;
  background:linear-gradient(180deg,rgba(10,37,64,.75) 0,transparent 100%);pointer-events:none}

/* ===== Nayara brand header + accordion menu (scoped under .nyh / .nyh-menu) ===== */
.nyh{position:absolute;top:0;left:0;width:100%;z-index:1000}
.nyh__inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:30px 44px}
.nyh__logo{display:block;line-height:0}
.nyh__logo img{width:205px;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.nyh__right{display:flex;align-items:center;gap:40px}
.nyh__book{border:1.6px solid #fff;color:#fff;text-transform:uppercase;font-family:'Inter',system-ui,sans-serif;font-weight:600;letter-spacing:1.6px;font-size:12.5px;padding:0 34px;height:50px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:background-color .3s ease,color .3s ease;text-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.nyh__book:hover{background:#fff;color:#0A2540;text-shadow:none}
.nyh__toggle{width:28px;height:20px;cursor:pointer;background:none;border:0;padding:0;display:inline-flex;flex-direction:column;justify-content:space-between}
.nyh__toggle span{display:block;height:2px;width:100%;background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}

/* Fullscreen accordion menu */
.nyh-menu{position:fixed;inset:0;z-index:1100;background:#0A2540;color:#fff;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .4s ease,transform .4s ease,visibility .4s ease;overflow-y:auto;padding:120px 24px 70px;-webkit-overflow-scrolling:touch}
.nyh-menu.open{opacity:1;visibility:visible;transform:translateY(0)}
.nyh-menu__close{position:absolute;top:24px;right:44px;background:none;border:0;color:#fff;font-size:38px;line-height:1;cursor:pointer;font-family:'Inter',system-ui,sans-serif}
.nyh-menu__props{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:34px}
.nyh-prop{width:152px;text-align:center;text-decoration:none;color:#fff;transition:transform .25s ease}
.nyh-prop:hover{transform:translateY(-6px)}
.nyh-prop img{width:120px;height:120px;object-fit:contain;margin:0 auto 12px;display:block}
.nyh-prop .t{font-family:'Playfair Display',Georgia,serif;font-size:26px;display:block;line-height:1.05}
.nyh-prop .d{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9fc7cb;display:block;margin-top:6px}
.nyh-menu__links{max-width:920px;margin:50px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:16px 36px;border-top:1px solid rgba(255,255,255,.18);padding-top:36px}
.nyh-menu__links a{color:#fff;text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:600}
.nyh-menu__links a:hover{color:#4DC9D1}
.nyh-menu__social{display:flex;justify-content:center;gap:28px;margin-top:36px}
.nyh-menu__social a{color:#fff;font-size:20px}
.nyh-menu__social a:hover{color:#4DC9D1}

@media (max-width:767px){
  .nyh__inner{padding:18px 20px}
  .nyh__logo img{width:150px}
  .nyh__book{display:none}
  .nyh-mobilecta{position:fixed;bottom:0;left:0;width:100%;z-index:1090;height:56px;display:flex;align-items:center;justify-content:center;background:#0A2540;color:#fff;text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:700;text-decoration:none;border-top:1.6px solid #fff}
  .nyh-prop{width:120px}.nyh-prop img{width:88px;height:88px}.nyh-prop .t{font-size:22px}
}
@media (min-width:768px){.nyh-mobilecta{display:none}}
</style>
</head>
<body>
<div class="stage">
  <!-- Brand header (grafted from nayarabocasdeltoro.com nav bar) -->
  <header class="nyh" id="nyh">
    <div class="nyh__inner">
      <a href="https://nayarabocasdeltoro.com" class="nyh__logo" aria-label="Nayara Bocas del Toro">
        <img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/header/logo2.svg" alt="Nayara Bocas del Toro">
      </a>
      <div class="nyh__right">
        <a href="#/booking/step-1" class="nyh__book">Book Now</a>
        <button class="nyh__toggle" id="nyhToggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Fullscreen accordion menu (hamburger) -->
  <nav class="nyh-menu" id="nyhMenu" aria-hidden="true">
    <button class="nyh-menu__close" id="nyhClose" aria-label="Close menu">&times;</button>
    <div class="nyh-menu__props">
      <a class="nyh-prop" href="https://nayarabocasdeltoro.com/stay/"><img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/menu/stay/img1.png" alt=""><span class="t">Stay</span><span class="d">Overwater Villas</span></a>
      <a class="nyh-prop" href="https://nayarabocasdeltoro.com/discover/"><img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/menu/discover/img1.png" alt=""><span class="t">Discover</span><span class="d">the experience</span></a>
      <a class="nyh-prop" href="https://nayarabocasdeltoro.com/eat/"><img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/menu/eat/img1.png" alt=""><span class="t">Eat</span><span class="d">gastronomy</span></a>
      <a class="nyh-prop" href="https://nayarabocasdeltoro.com/explore/"><img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/menu/explore/img1.png" alt=""><span class="t">Explore</span><span class="d">activities</span></a>
      <a class="nyh-prop" href="https://nayarabocasdeltoro.com/unwind/"><img src="https://nayarabocasdeltoro.com/wp-content/themes/nayara/img/menu/unwind/img1.png" alt=""><span class="t">Unwind</span><span class="d">Spa</span></a>
    </div>
    <div class="nyh-menu__links">
      <a href="https://nayarabocasdeltoro.com/about/">About</a>
      <a href="https://nayarabocasdeltoro.com/contact/">Contact</a>
      <a href="https://nayarabocasdeltoro.com/gallery/">Gallery</a>
      <a href="https://www.lhw.com/leaders-club-hub?hotel=38262" target="_blank" rel="noopener">Leaders Club</a>
      <a href="#/booking/step-1">Book Now</a>
    </div>
    <div class="nyh-menu__social">
      <a href="https://www.instagram.com/nayarabocasdeltoro/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.youtube.com/@nayararesorts1" target="_blank" rel="noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      <a href="https://www.facebook.com/nayarabocasdeltoro" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    </div>
  </nav>

  <a href="#/booking/step-1" class="nyh-mobilecta">Book Now</a>
</div>

<script>
(function () {
  var tgl = document.getElementById('nyhToggle');
  var menu = document.getElementById('nyhMenu');
  var cls = document.getElementById('nyhClose');
  function openMenu(){menu.classList.add('open');menu.setAttribute('aria-hidden','false');tgl.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}
  function closeMenu(){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');tgl.setAttribute('aria-expanded','false');document.body.style.overflow='';}
  tgl.addEventListener('click', openMenu);
  cls.addEventListener('click', closeMenu);
  menu.querySelectorAll('a').forEach(function(a){a.addEventListener('click', closeMenu);});
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMenu(); });
})();
</script>
</body>
</html>
